name: build-environment-image

on:
  push:
    branches: [main]
    paths:
      - "environments/alpine-3.24-musl/Containerfile"
      - "environments/alpine-3.24-musl/requirements-builder.txt"
      - "environments/alpine-3.24-musl/assert-sccache-build.sh"
      - "environments/alpine-3.24-musl/apk.lock.*"
      - ".github/workflows/build-environment-image.yml"
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/python-wheels-builder-alpine
  CONTEXT: environments/alpine-3.24-musl
  INPUTS_PREDICATE_TYPE: https://github.com/patrickryankenneth/python-wheels-builder/predicate/builder-inputs/v1

# No default permissions; each job asks for exactly what it needs.
permissions: {}

jobs:
  build-attest:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute recipe tag
        id: tag
        env:
          ARCH: ${{ matrix.arch }}
        run: echo "tag=${{ hashFiles('environments/alpine-3.24-musl/Containerfile', 'environments/alpine-3.24-musl/requirements-builder.txt', 'environments/alpine-3.24-musl/assert-sccache-build.sh') }}-${ARCH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # Build locally first so a bad apk lock fails BEFORE anything is pushed.
      - name: Build (local, not pushed yet)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build --load --progress=plain \
            -f "$CONTEXT/Containerfile" \
            -t "$IMAGE:$TAG" \
            "$CONTEXT" 2>&1 | tee "build.$ARCH.log"

      - name: Check apk package list against committed lock (exact match)
        env:
          TAG: ${{ matrix.arch }}
          REF: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          actual_arch="$(docker run --rm --entrypoint apk "$IMAGE:$REF" --print-arch)"
          if [ "$actual_arch" != "$TAG" ]; then
            echo "::error::image architecture is $actual_arch, expected $TAG"
            exit 1
          fi
          docker run --rm --entrypoint sh "$IMAGE:$REF" -c 'apk info -v | LC_ALL=C sort' > apk.actual
          [ -s apk.actual ] || { echo "::error::apk list is empty"; exit 1; }
          LOCK="$CONTEXT/apk.lock.$TAG"
          if [ ! -f "$LOCK" ]; then
            echo "::error::$LOCK is missing. Download the apk-lock-$TAG artifact, review it, commit it as $LOCK."
            exit 1
          fi
          if ! diff -u "$LOCK" apk.actual; then
            echo "::error::Installed apk packages differ from $LOCK. If the change is intended, commit the new list."
            exit 1
          fi
          echo "apk package list matches $LOCK" | tee -a "build.$TAG.log"

      - name: Upload apk list (for first-time lock or review)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-lock-${{ matrix.arch }}
          path: apk.actual
          if-no-files-found: ignore

      - name: Push and capture digest
        id: push
        env:
          REF: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE:$REF" 2>&1 | tee -a "build.${{ matrix.arch }}.log"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$REF" | cut -d@ -f2)"
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "::error::bad digest: $DIGEST"; exit 1;; esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed $IMAGE@$DIGEST" | tee -a "build.${{ matrix.arch }}.log"
          echo "$DIGEST" > "image.digest.${{ matrix.arch }}"
          echo "### ${{ matrix.arch }} builder digest" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/python-wheels-builder-alpine
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify the attestation we just made
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/build-environment-image.yml"

      - name: Record builder inputs
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          case "$ARCH" in
            x86_64)  goarch=amd64; rustup_sha_var=RUSTUP_SHA256_X86_64 ;;
            aarch64) goarch=arm64; rustup_sha_var=RUSTUP_SHA256_AARCH64 ;;
            *) echo "::error::unknown arch $ARCH"; exit 1 ;;
          esac
          # The runner image is a declared trust root (not pinned): record exactly what ran.
          [ -n "${ImageOS:-}" ] && [ -n "${ImageVersion:-}" ] \
            || { echo "::error::ImageOS/ImageVersion not set; not a GitHub-hosted runner?"; exit 1; }
          docker_version="$(docker version --format '{{.Server.Version}}')"
          buildx_version="$(docker buildx version | awk '{print $2}')"
          [ -n "$docker_version" ] && [ -n "$buildx_version" ] || { echo "::error::cannot read docker/buildx versions"; exit 1; }
          arg() { sed -n "s/^ARG $1=//p" "$CONTEXT/Containerfile"; }
          base="$(awk '/^FROM /{print $2; exit}' "$CONTEXT/Containerfile")"
          base_ref="${base%@*}"
          base_index="${base#*@}"
          base_platform_digest="$(docker buildx imagetools inspect --raw "$base" \
            | jq -r --arg a "$goarch" '[.manifests[] | select(.platform.os=="linux" and .platform.architecture==$a)][0].digest // empty')"
          [ -n "$base_platform_digest" ] || { echo "::error::no linux/$goarch manifest in base index"; exit 1; }
          jq -n \
            --arg base_ref "$base_ref" \
            --arg base_index "$base_index" \
            --arg base_platform "linux/$goarch" \
            --arg base_platform_digest "$base_platform_digest" \
            --arg rustup_version "$(arg RUSTUP_VERSION)" \
            --arg rustup_sha256 "$(arg "$rustup_sha_var")" \
            --arg rust_version "$(arg RUST_VERSION)" \
            --arg sccache_version "$(arg SCCACHE_VERSION)" \
            --arg cargo_auditable_version "$(arg CARGO_AUDITABLE_VERSION)" \
            --arg assert_script_sha256 "$(sha256sum "$CONTEXT/assert-sccache-build.sh" | cut -d' ' -f1)" \
            --arg requirements_sha256 "$(sha256sum "$CONTEXT/requirements-builder.txt" | cut -d' ' -f1)" \
            --arg apk_lock_sha256 "$(sha256sum "$CONTEXT/apk.lock.$ARCH" | cut -d' ' -f1)" \
            --arg runner_image_os "$ImageOS" \
            --arg runner_image_version "$ImageVersion" \
            --arg runner_arch "${RUNNER_ARCH:-}" \
            --arg docker_version "$docker_version" \
            --arg buildx_version "$buildx_version" \
            --arg builder_image "$IMAGE@$DIGEST" \
            --arg commit "$COMMIT" \
            '{base_image_ref:$base_ref, base_image_index_digest:$base_index, base_platform:$base_platform,
              base_platform_manifest_digest:$base_platform_digest, rustup_version:$rustup_version,
              rustup_sha256:$rustup_sha256, rust_version:$rust_version, sccache_version:$sccache_version,
              cargo_auditable_version:$cargo_auditable_version, assert_script_sha256:$assert_script_sha256,
              requirements_builder_sha256:$requirements_sha256, apk_lock_sha256:$apk_lock_sha256,
              runner:{image_os:$runner_image_os, image_version:$runner_image_version, arch:$runner_arch,
                      docker_version:$docker_version, buildx_version:$buildx_version},
              builder_image:$builder_image, source_commit:$commit}' > "builder-inputs.$ARCH.json"
          cat "builder-inputs.$ARCH.json"

      - name: Attest builder inputs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/python-wheels-builder-alpine
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: ${{ env.INPUTS_PREDICATE_TYPE }}
          predicate-path: builder-inputs.${{ matrix.arch }}.json
          push-to-registry: true

      - name: Verify the builder-inputs attestation we just made
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/build-environment-image.yml" \
            --predicate-type "$INPUTS_PREDICATE_TYPE" --format json \
            | jq -e --slurpfile want "builder-inputs.$ARCH.json" \
                'any(.[]; .verificationResult.statement.predicate == $want[0])' > /dev/null

      - name: Package build log
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [ -s "build.$ARCH.log" ] || { echo "::error::build log is empty"; exit 1; }
          gzip -9 -n -c "build.$ARCH.log" > "build-log.$ARCH.txt.gz"
          ls -l "build-log.$ARCH.txt.gz"

      - name: Attest build log
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build-log.${{ matrix.arch }}.txt.gz

      - name: Verify the build-log attestation we just made
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          gh attestation verify "build-log.$ARCH.txt.gz" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/build-environment-image.yml"

      - name: Upload digest, inputs and build log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: |
            image.digest.${{ matrix.arch }}
            builder-inputs.${{ matrix.arch }}.json
            build-log.${{ matrix.arch }}.txt.gz